name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789abcdef
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAIL: ci-admin@example.test
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: no-reply@example.test
      CRON_SECRET: ci-only-cron-secret-not-for-production-0123456789abcdef
      B2B_REAL_DASHBOARD_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create isolated CI database
        run: npx prisma db push --skip-generate

      - name: Root typecheck
        run: npm run typecheck

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migration integrity
        run: npm run test:migration-integrity

      - name: W8 hardening checks
        run: npm run test:w8

      - name: Production build
        run: npm run build
