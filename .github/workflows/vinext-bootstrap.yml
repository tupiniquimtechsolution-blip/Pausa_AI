name: Vinext Cloudflare Bootstrap

on:
  push:
    branches:
      - "chatgpt/vinext-cloudflare-bootstrap"

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[vinext-init]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-vinext-bootstrap-jwt-secret-long
      RATE_LIMIT_PEPPER: ci-vinext-bootstrap-rate-pepper
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      RELEASE_VERSION: ci-vinext
      ADMIN_EMAIL: admin@pausaai.test
      B2B_REAL_DASHBOARD_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chatgpt/vinext-cloudflare-bootstrap"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify vinext compatibility
        run: npx --yes vinext check
      - name: Initialize vinext for Cloudflare Workers
        run: npx --yes vinext init --platform=cloudflare --skip-check
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate vinext production build
        run: npm run build:vinext
      - name: Commit generated vinext configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "chore: initialize vinext for Cloudflare [vinext-init]"
          git push origin HEAD:chatgpt/vinext-cloudflare-bootstrap
