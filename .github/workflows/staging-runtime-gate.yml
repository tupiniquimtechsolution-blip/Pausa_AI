name: Staging Runtime Gate

on:
  push:
    branches: ["fix/staging-auth-runtime-2026-10-02"]
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "cloudflare.config.ts"
      - "lib/prisma.ts"
      - "prisma/schema.postgresql.prisma"
      - "scripts/check-config.mjs"
      - "scripts/verify-postgres-adapter.ts"
      - "app/api/health/route.ts"
      - ".github/workflows/staging-runtime-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pausa
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: pausa_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pausa -d pausa_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://pausa:testpass@127.0.0.1:5432/pausa_ai
      JWT_SECRET: ci-only-jwt-secret-32-characters-minimum
      RATE_LIMIT_PEPPER: ci-only-rate-limit-pepper-32-chars-minimum
      CRON_SECRET: ci-only-cron-secret-32-characters-minimum
      COOKIE_SECURE: "true"
      APP_BASE_URL: https://staging.example.test
      ADMIN_EMAIL: admin@example.test
      RESEND_API_KEY: re_ci_only_placeholder_key
      RESEND_FROM_EMAIL: Pausa AI <onboarding@example.test>
      AUDIT_LOG_RETENTION_DAYS: "180"
      RELEASE_VERSION: staging-runtime-ci
      B2B_REAL_DASHBOARD_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/schema.postgresql.prisma

      - name: Create PostgreSQL schema
        run: npx prisma db push --schema prisma/schema.postgresql.prisma --skip-generate

      - name: Validate staging configuration
        run: npm run config:check:staging

      - name: Verify PostgreSQL adapter
        run: npm run test:postgres-adapter

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Build Vinext Worker
        run: npm run build:vinext
