name: Cloudflare Vinext Build Evidence

on:
  push:
    branches:
      - "chatgpt/release-green-finalization-2026-09-30"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vinext-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pausa_ai
      JWT_SECRET: ci-cloudflare-vinext-jwt-secret-2026-09-30
      RATE_LIMIT_PEPPER: ci-cloudflare-vinext-rate-pepper-2026-09-30
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      RELEASE_VERSION: vinext-ci
      ADMIN_EMAIL: admin@pausaai.test
      B2B_REAL_DASHBOARD_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconcile lockfile on finalization branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name "pausa-ai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "build: sync lockfile for PostgreSQL Worker runtime"
            git push origin HEAD:chatgpt/release-green-finalization-2026-09-30
          fi
      - run: npm ci
      - name: Generate PostgreSQL Prisma Client for Worker
        run: npx prisma generate --schema prisma/schema.postgresql.prisma
      - name: Validate PostgreSQL Prisma schema
        run: npx prisma validate --schema prisma/schema.postgresql.prisma
      - name: Initialize vinext for Cloudflare
        run: npx --yes vinext init --platform=cloudflare --skip-check --data-cache=kv --image-optimization=cloudflare-images
      - name: Build Cloudflare Worker output
        run: npm run build:vinext
      - name: Validate generated source configuration
        shell: bash
        run: |
          test -f vite.config.ts
          test -f cloudflare.config.ts
          grep -q '"build:vinext"' package.json
          grep -q '"@prisma/adapter-pg"' package.json
          grep -q 'engineType = "client"' prisma/schema.postgresql.prisma
      - name: Persist generated source configuration on finalization branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "pausa-ai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts cloudflare.config.ts tsconfig.json .gitignore
          if [ -f wrangler.jsonc ]; then git add wrangler.jsonc; fi
          if git diff --cached --quiet; then
            echo "Vinext source configuration already current."
          else
            git commit -m "infra: persist Cloudflare vinext configuration"
            git push origin HEAD:chatgpt/release-green-finalization-2026-09-30
          fi
