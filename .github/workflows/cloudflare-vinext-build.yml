name: Cloudflare Vinext Build Evidence

on:
  push:
    branches:
      - "chatgpt/release-green-2026-09-28"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vinext-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-cloudflare-vinext-jwt-secret-2026-09-30
      RATE_LIMIT_PEPPER: ci-cloudflare-vinext-rate-pepper-2026-09-30
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      RELEASE_VERSION: vinext-ci
      ADMIN_EMAIL: admin@pausaai.test
      B2B_REAL_DASHBOARD_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - name: Initialize vinext for Cloudflare in CI workspace
        run: npx --yes vinext init --platform=cloudflare --skip-check --data-cache=kv --image-optimization=cloudflare-images
      - name: Build Cloudflare Worker output
        run: npm run build:vinext
      - name: Capture generated migration files
        shell: bash
        run: |
          mkdir -p artifacts
          git diff -- . ':!.github/workflows/cloudflare-vinext-build.yml' > artifacts/vinext-init.patch
          cp package.json artifacts/package.json
          cp package-lock.json artifacts/package-lock.json
          test -f vite.config.ts && cp vite.config.ts artifacts/vite.config.ts
          test -f cloudflare.config.ts && cp cloudflare.config.ts artifacts/cloudflare.config.ts
          test -f wrangler.jsonc && cp wrangler.jsonc artifacts/wrangler.jsonc || true
          git status --short > artifacts/git-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vinext-cloudflare-config
          path: artifacts/
          if-no-files-found: error
