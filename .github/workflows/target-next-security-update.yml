name: Targeted Next Security Update

on:
  push:
    branches: ["security/next-16.3.6"]
    paths: [".github/workflows/target-next-security-update.yml"]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-targeted-next-jwt-secret-2026-09-30
      RATE_LIMIT_PEPPER: ci-targeted-next-rate-pepper-2026-09-30
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://127.0.0.1:3000
      RELEASE_VERSION: security-next-16.3.6
      ADMIN_EMAIL: admin@pausaai.test
      B2B_REAL_DASHBOARD_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-16.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply only the patched Next.js release
        run: npm install next@16.3.6 --save-exact
      - run: npm ci --prefix mobile
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm run build
      - run: npm run test:w8
      - name: Audit after targeted update
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-after-next.json || true
          node -e '
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("/tmp/npm-audit-after-next.json","utf8"));
          console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities ?? null,vulnerabilities:Object.fromEntries(Object.entries(r.vulnerabilities||{}).map(([k,v])=>[k,{severity:v.severity,isDirect:v.isDirect,fixAvailable:v.fixAvailable}]))},null,2));
          '
      - name: Commit package update only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/target-next-security-update.yml
          git add package.json package-lock.json
          git commit -m "fix(security): update Next.js to 16.3.6"
          git push origin HEAD:security/next-16.3.6
