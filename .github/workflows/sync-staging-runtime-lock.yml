name: Sync lockfile for staging runtime fix

on:
  push:
    branches: ["fix/staging-auth-runtime-2026-10-02"]
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/staging-auth-runtime-2026-10-02"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync lockfile for prisma adapter"
          git push origin HEAD:fix/staging-auth-runtime-2026-10-02
