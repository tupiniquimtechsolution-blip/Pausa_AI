name: Cloudflare Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.PAUSA_STAGING_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.PAUSA_STAGING_JWT_SECRET }}
      RATE_LIMIT_PEPPER: ${{ secrets.PAUSA_STAGING_RATE_LIMIT_PEPPER }}
      CRON_SECRET: ${{ secrets.PAUSA_STAGING_CRON_SECRET }}
      APP_BASE_URL: ${{ secrets.PAUSA_STAGING_APP_BASE_URL }}
      ADMIN_EMAIL: ${{ secrets.PAUSA_STAGING_ADMIN_EMAIL }}
      RELEASE_VERSION: staging-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate required staging secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            DATABASE_URL
            JWT_SECRET
            RATE_LIMIT_PEPPER
            CRON_SECRET
            APP_BASE_URL
            ADMIN_EMAIL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required staging secret: $name"
              exit 1
            fi
          done
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::PAUSA_STAGING_DATABASE_URL must be PostgreSQL."
              exit 1
              ;;
          esac
          case "$APP_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::PAUSA_STAGING_APP_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

      - run: npm ci

      - name: Generate PostgreSQL Prisma Client
        run: npx prisma generate --schema prisma/schema.postgresql.prisma

      - name: Validate PostgreSQL Prisma schema
        run: npx prisma validate --schema prisma/schema.postgresql.prisma

      - name: Build staging Worker
        run: npx cf build --mode staging

      - name: Prepare ephemeral Worker secrets file
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/pausa-ai-staging.env"
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'RATE_LIMIT_PEPPER=%s\n' "$RATE_LIMIT_PEPPER"
            printf 'CRON_SECRET=%s\n' "$CRON_SECRET"
            printf 'APP_BASE_URL=%s\n' "$APP_BASE_URL"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
          } > "$secrets_file"
          echo "PAUSA_STAGING_SECRETS_FILE=$secrets_file" >> "$GITHUB_ENV"

      - name: Deploy prebuilt staging Worker
        run: >
          npx cf deploy
          --prebuilt
          --mode staging
          --secrets-file "$PAUSA_STAGING_SECRETS_FILE"
          --message "Pausa AI staging ${{ github.sha }}"
          --tag "staging-${{ github.run_number }}"

      - name: Health smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3             "${APP_BASE_URL%/}/api/system/health"

      - name: Public shell smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3             --output /dev/null "${APP_BASE_URL%/}/"
