name: Vinext Cloudflare Init Once

on:
  push:
    branches:
      - "chatgpt/fix-vinext-cloudflare-init"

permissions:
  contents: write

jobs:
  init-vinext:
    if: ${{ !contains(github.event.head_commit.message, '[vinext-init]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-vinext-cloudflare-init
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Initialize vinext for Cloudflare
        run: >
          npx --yes vinext init
          --platform=cloudflare
          --skip-check
          --cdn-cache=none
          --data-cache=none
          --image-optimization=none
      - name: Configure staging worker name and workers.dev
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "cloudflare.config.ts";
          if (!fs.existsSync(path)) {
            throw new Error("cloudflare.config.ts was not generated by vinext init");
          }
          let code = fs.readFileSync(path, "utf8");
          code = code.replace(/name:\s*["']pausa-ai["']/, 'name: "pausa-ai-staging"');
          if (!code.includes('name: "pausa-ai-staging"')) {
            throw new Error("Could not set Worker name to pausa-ai-staging");
          }
          fs.writeFileSync(path, code);
          NODE
      - name: Include generated Cloudflare runtime types
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const p = "tsconfig.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          j.include ??= [];
          if (!j.include.includes(".cloudflare/types/**/*.ts")) {
            j.include.push(".cloudflare/types/**/*.ts");
          }
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          NODE
      - name: Build vinext
        run: npm run build:vinext
      - name: Remove one-time initializer workflow
        run: rm -f .github/workflows/vinext-init-once.yml
      - name: Commit generated vinext configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "build: initialize vinext Cloudflare staging [vinext-init]"
          git push origin HEAD:chatgpt/fix-vinext-cloudflare-init
